<!doctype html>
<html lang="en" class="splash-active">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Asclepius · Astronaut Medical Program</title>
    <meta name="description" content="Asclepius - an explainable health expert system for astronauts." />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/png" href="/brand/favicon-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/brand/favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/brand/logo-splash.webp" />
    <!-- Loading splash "Earthrise + Pulse". It lives here, not in React, so it plays before the JS bundle
         arrives. Choreography: stars -> the mark rises from the horizon -> an ECG trace runs along the
         Earth's limb and its R-peak hits the staff (the mark beats) -> wordmark wipe + glint.
         src/splash.ts fades the splash out once the app is ready.
         Base styles are the final frame, so reduced motion simply shows the static logo. -->
    <style>
      html.splash-active{background:#050608}
      html.splash-active body{overflow:hidden}
      #splash{--s:min(86vmin,560px);position:fixed;inset:0;z-index:1000;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;animation:sp-failsafe .6s ease 9s forwards}
      #splash.leaving{pointer-events:none}
      .sp-bg{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 56%,#0b1220 0%,#060810 48%,#030405 100%)}
      .sp-stars{position:absolute;inset:-3%;animation:sp-drift 9s linear both}
      .sp-stars i{position:absolute;width:var(--z);height:var(--z);border-radius:50%;background:#dfe9ff;opacity:var(--o);animation:sp-star-in .7s ease-out var(--d) both,sp-twinkle var(--t) ease-in-out calc(var(--d) + .7s) infinite alternate}
      .sp-stars i.big{box-shadow:0 0 4px 1px rgba(170,205,255,.55)}
      .sp-stars i.big::before,.sp-stars i.big::after{content:"";position:absolute;left:50%;top:50%;width:calc(var(--z) * 6);height:1px;background:linear-gradient(90deg,transparent,rgba(205,225,255,.85),transparent);transform:translate(-50%,-50%)}
      .sp-stars i.big::after{transform:translate(-50%,-50%) rotate(90deg)}
      .sp-stage{position:absolute;width:var(--s);height:var(--s);left:calc(50% - var(--s) / 2);top:calc(50% - var(--s) * .46)}
      .sp-glow{position:absolute;left:calc(var(--s) * .1);top:calc(var(--s) * .41);width:calc(var(--s) * .8);height:calc(var(--s) * .25);border-radius:50%;background:radial-gradient(closest-side,rgba(110,175,255,.42),rgba(60,120,255,.15) 55%,transparent);animation:sp-glow 1.6s cubic-bezier(.2,.7,.2,1) .25s both}
      .sp-glow::after{content:"";position:absolute;inset:15% 28%;border-radius:50%;background:radial-gradient(closest-side,rgba(175,215,255,.7),transparent);opacity:0;animation:sp-flash .8s ease-out 1.48s both}
      /* crops of the 800x800 logo (--x/--y/--w/--h in source px) */
      .sp-crop{position:absolute;left:calc(var(--s) * var(--x) / 800);top:calc(var(--s) * var(--y) / 800);width:calc(var(--s) * var(--w) / 800);height:calc(var(--s) * var(--h) / 800)}
      .sp-rise,.sp-beat,.sp-clip,.sp-glint{position:absolute;inset:0}
      .sp-clip,.sp-glint{overflow:hidden}
      .sp-crop img{position:absolute;display:block;left:calc(var(--s) * var(--x) / -800);top:calc(var(--s) * var(--y) / -800);width:var(--s);height:var(--s);max-width:none;pointer-events:none;-webkit-user-drag:none}
      .sp-rise{animation:sp-rise 1.3s cubic-bezier(.16,.84,.3,1) .2s both}
      .sp-mark .sp-clip{-webkit-mask-image:linear-gradient(to top,#000 40%,transparent 60%);mask-image:linear-gradient(to top,#000 40%,transparent 60%);-webkit-mask-size:100% 250%;mask-size:100% 250%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:0 100%;mask-position:0 100%;animation:sp-reveal 1.1s cubic-bezier(.4,0,.2,1) .2s both}
      .sp-beat{transform-origin:50% 72%;animation:sp-beat .6s cubic-bezier(.3,0,.2,1) 1.45s both}
      .sp-word .sp-clip{-webkit-mask-image:linear-gradient(to right,#000 40%,transparent 60%);mask-image:linear-gradient(to right,#000 40%,transparent 60%);-webkit-mask-size:250% 100%;mask-size:250% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:0 0;mask-position:0 0;animation:sp-wipe .8s cubic-bezier(.3,.6,.2,1) 1.7s both}
      .sp-glint{opacity:0;-webkit-mask-image:linear-gradient(100deg,transparent 42%,#000 50%,transparent 58%);mask-image:linear-gradient(100deg,transparent 42%,#000 50%,transparent 58%);-webkit-mask-size:300% 100%;mask-size:300% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:100% 0;mask-position:100% 0;animation:sp-glint 1s ease-in-out 2.3s both}
      .sp-glint img{filter:brightness(1.5) drop-shadow(0 0 5px #9fd0ff)}
      .sp-sub{animation:sp-up .7s cubic-bezier(.2,.7,.2,1) 2s both}
      .sp-ecg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
      .sp-ecg path{fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
      .sp-ecg .tr{stroke:url(#sp-ecg-g);stroke-width:3.6;stroke-dasharray:1 1;stroke-dashoffset:0;filter:drop-shadow(0 0 3px #5fb0ff) drop-shadow(0 0 10px rgba(80,160,255,.8));animation:sp-draw .8s cubic-bezier(.45,0,.55,1) 1.1s both,sp-out .7s ease 2.05s both}
      .sp-ecg .cm{stroke:#eaf6ff;stroke-width:6.5;stroke-dasharray:.09 2;filter:drop-shadow(0 0 5px #8fd0ff) drop-shadow(0 0 16px #3d9bff);animation:sp-comet .8s cubic-bezier(.45,0,.55,1) 1.1s both}
      .sp-wait{position:absolute;left:0;right:0;bottom:calc(32px + env(safe-area-inset-bottom,0px));text-align:center;font:500 11px/1.4 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.24em;text-transform:uppercase;color:#8a929d;opacity:0;transition:opacity .5s}
      #splash.waiting .sp-wait{opacity:1}
      .sp-wait::after{content:"...";display:inline-block;width:0;overflow:hidden;vertical-align:bottom;text-align:left;animation:sp-dots 1.2s steps(4,jump-none) infinite}
      .sp-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
      /* the intro waits for the logo image, so it never plays over an empty frame */
      #splash:not(.go) .sp-stage,#splash:not(.go) .sp-stage *,#splash:not(.go) .sp-stage *::after{animation-play-state:paused}
      @keyframes sp-failsafe{to{opacity:0;visibility:hidden}}
      @keyframes sp-drift{from{transform:translate3d(0,12px,0) scale(1.03)}}
      @keyframes sp-star-in{from{opacity:0;transform:scale(.2)}}
      @keyframes sp-twinkle{to{opacity:calc(var(--o) * .25)}}
      @keyframes sp-glow{from{opacity:0;transform:scale(.5,.3)}}
      @keyframes sp-flash{20%{opacity:1}to{opacity:0}}
      @keyframes sp-rise{from{opacity:0;transform:translateY(14%) scale(.94);filter:blur(10px)}55%{opacity:1}}
      @keyframes sp-reveal{from{-webkit-mask-position:0 0;mask-position:0 0}}
      @keyframes sp-beat{0%{transform:none;filter:none}22%{transform:scale(1.05);filter:drop-shadow(0 0 calc(var(--s) * .03) rgba(130,190,255,.85)) brightness(1.2)}55%{transform:scale(.995)}100%{transform:none;filter:none}}
      @keyframes sp-draw{from{stroke-dashoffset:1;opacity:1}to{stroke-dashoffset:0;opacity:1}}
      @keyframes sp-out{from{opacity:1}to{opacity:0}}
      @keyframes sp-comet{from{stroke-dashoffset:.07;opacity:1}to{stroke-dashoffset:-1;opacity:1}}
      @keyframes sp-wipe{from{-webkit-mask-position:100% 0;mask-position:100% 0;transform:scaleX(1.08);opacity:.3}}
      @keyframes sp-glint{from{-webkit-mask-position:100% 0;mask-position:100% 0;opacity:1}to{-webkit-mask-position:0 0;mask-position:0 0;opacity:1}}
      @keyframes sp-up{from{opacity:0;transform:translateY(40%)}}
      @keyframes sp-dots{to{width:calc(3ch + .72em)}}
      @media (prefers-reduced-motion: reduce){
        #splash *,#splash *::before,#splash *::after{animation:none!important}
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-live="polite">
      <span class="sp-sr">Loading Asclepius…</span>
      <div class="sp-bg" aria-hidden="true"></div>
      <div class="sp-stars" aria-hidden="true"></div>
      <div class="sp-stage" aria-hidden="true">
        <div class="sp-glow"></div>
        <div class="sp-crop sp-mark" style="--x:160;--y:128;--w:470;--h:380">
          <div class="sp-rise"><div class="sp-beat"><div class="sp-clip"><img src="/brand/logo-splash.webp" alt="" decoding="async" /></div></div></div>
        </div>
        <svg class="sp-ecg" viewBox="0 0 800 800" focusable="false">
          <defs>
            <linearGradient id="sp-ecg-g" gradientUnits="userSpaceOnUse" x1="140" y1="0" x2="660" y2="0">
              <stop offset="0" stop-color="#6db8ff" stop-opacity="0" />
              <stop offset=".25" stop-color="#7cc2ff" stop-opacity=".95" />
              <stop offset=".5" stop-color="#b9e0ff" />
              <stop offset=".75" stop-color="#7cc2ff" stop-opacity=".95" />
              <stop offset="1" stop-color="#6db8ff" stop-opacity="0" />
            </linearGradient>
          </defs>
          <path class="tr" pathLength="1" d="M140.0 518.6 L150.2 508.3 L160.9 498.3 L171.9 488.9 L183.3 479.9 L195.1 471.3 L207.2 463.2 L219.6 455.7 L232.3 448.6 L245.3 442.1 L258.5 436.1 L272.0 430.6 L285.7 425.7 L299.6 421.3 L313.4 416.8 L316.7 415.3 L319.8 413.4 L323.0 411.3 L326.0 408.8 L329.2 406.4 L332.4 404.2 L335.8 402.8 L339.3 402.1 L343.0 402.4 L346.7 403.3 L350.5 404.6 L354.2 405.9 L357.9 406.9 L361.5 407.6 L365.1 407.9 L368.6 408.0 L372.1 407.9 L375.6 407.8 L379.1 407.6 L382.6 407.4 L385.5 407.3 L390.9 416.1 L400.0 323.0 L407.1 429.0 L413.4 406.9 L414.0 406.9 L417.5 406.8 L421.0 406.5 L424.5 406.0 L428.1 405.3 L431.7 404.2 L435.4 402.8 L439.2 401.2 L443.0 399.4 L446.8 397.6 L450.7 396.1 L454.5 395.1 L458.2 394.7 L461.9 395.2 L465.3 396.4 L468.7 398.4 L471.9 401.0 L475.0 403.8 L478.0 406.7 L481.1 409.6 L484.1 412.1 L487.2 414.4 L490.3 416.3 L493.5 418.0 L507.1 423.3 L520.9 428.0 L534.5 433.2 L547.9 438.9 L561.0 445.2 L573.8 451.9 L586.4 459.2 L598.7 467.0 L610.6 475.3 L622.2 484.1 L633.4 493.4 L644.3 503.0 L654.7 513.2" />
          <path class="cm" pathLength="1" d="M140.0 518.6 L150.2 508.3 L160.9 498.3 L171.9 488.9 L183.3 479.9 L195.1 471.3 L207.2 463.2 L219.6 455.7 L232.3 448.6 L245.3 442.1 L258.5 436.1 L272.0 430.6 L285.7 425.7 L299.6 421.3 L313.4 416.8 L316.7 415.3 L319.8 413.4 L323.0 411.3 L326.0 408.8 L329.2 406.4 L332.4 404.2 L335.8 402.8 L339.3 402.1 L343.0 402.4 L346.7 403.3 L350.5 404.6 L354.2 405.9 L357.9 406.9 L361.5 407.6 L365.1 407.9 L368.6 408.0 L372.1 407.9 L375.6 407.8 L379.1 407.6 L382.6 407.4 L385.5 407.3 L390.9 416.1 L400.0 323.0 L407.1 429.0 L413.4 406.9 L414.0 406.9 L417.5 406.8 L421.0 406.5 L424.5 406.0 L428.1 405.3 L431.7 404.2 L435.4 402.8 L439.2 401.2 L443.0 399.4 L446.8 397.6 L450.7 396.1 L454.5 395.1 L458.2 394.7 L461.9 395.2 L465.3 396.4 L468.7 398.4 L471.9 401.0 L475.0 403.8 L478.0 406.7 L481.1 409.6 L484.1 412.1 L487.2 414.4 L490.3 416.3 L493.5 418.0 L507.1 423.3 L520.9 428.0 L534.5 433.2 L547.9 438.9 L561.0 445.2 L573.8 451.9 L586.4 459.2 L598.7 467.0 L610.6 475.3 L622.2 484.1 L633.4 493.4 L644.3 503.0 L654.7 513.2" />
        </svg>
        <div class="sp-crop sp-word" style="--x:96;--y:516;--w:612;--h:62">
          <div class="sp-clip">
            <img src="/brand/logo-splash.webp" alt="" decoding="async" />
            <div class="sp-glint"><img src="/brand/logo-splash.webp" alt="" decoding="async" /></div>
          </div>
        </div>
        <div class="sp-crop sp-sub" style="--x:140;--y:580;--w:520;--h:30">
          <div class="sp-clip"><img src="/brand/logo-splash.webp" alt="" decoding="async" /></div>
        </div>
      </div>
      <div class="sp-wait" aria-hidden="true">Connecting to mission data</div>
    </div>
    <script>
      (function () {
        var root = document.documentElement, sp = document.getElementById("splash");
        if (!sp) return;
        if (/[?&]nosplash\b/.test(location.search)) { sp.remove(); root.classList.remove("splash-active"); return; }
        // read by src/splash.ts: when the intro started, and whether the viewer skipped it
        var st = window.__splash = { t0: performance.now(), skipped: false };

        // the same sky stays behind the console in dark theme (src/components/Starfield.tsx reads st.stars)
        var stars = sp.querySelector(".sp-stars"), frag = document.createDocumentFragment();
        st.stars = [];
        for (var i = 0; i < 140; i++) {
          var big = Math.random() < 0.1, p = { x: +(Math.random() * 100).toFixed(2), y: +(Math.random() * 100).toFixed(2),
            z: +(big ? 2 + Math.random() * 1.2 : 0.8 + Math.random() * 1.1).toFixed(2), o: +(0.35 + Math.random() * 0.6).toFixed(2),
            d: +(Math.random() * 0.9).toFixed(2), t: +(1.6 + Math.random() * 2.4).toFixed(2), big: big };
          var s = document.createElement("i");
          s.style.cssText = "left:" + p.x + "%;top:" + p.y + "%;--z:" + p.z + "px;--o:" + p.o + ";--d:" + p.d + "s;--t:" + p.t + "s";
          if (big) s.className = "big";
          st.stars.push(p); frag.appendChild(s);
        }
        stars.appendChild(frag);

        var started = false;
        function go() { if (started) return; started = true; st.t0 = performance.now(); sp.classList.add("go"); }
        var img = sp.querySelector(".sp-mark img");
        if (img.complete && img.naturalWidth) go();
        else { img.addEventListener("load", go); img.addEventListener("error", go); setTimeout(go, 1500); }

        // click, tap or any key skips the rest of the intro
        function skip() {
          if (st.skipped || !sp.isConnected) return;
          st.skipped = true; go();
          sp.getAnimations({ subtree: true }).forEach(function (a) {
            var t = a.effect && a.effect.getTiming();
            if (a.effect && a.effect.target !== sp && t && t.iterations !== Infinity) { try { a.finish(); } catch (e) { /* ignore */ } }
          });
          window.dispatchEvent(new Event("splash:skip"));
        }
        sp.addEventListener("pointerdown", skip);
        window.addEventListener("keydown", skip);

        setTimeout(function () { if (sp.isConnected && !sp.classList.contains("leaving")) sp.classList.add("waiting"); }, 3300);
        // failsafe: the app never signalled ready (backend hung, bundle failed) -> leave anyway
        setTimeout(function () {
          if (!sp.isConnected || sp.classList.contains("leaving")) return;
          if (window.__dismissSplash) { window.__dismissSplash(); return; }
          root.classList.remove("splash-active"); sp.classList.add("leaving");
          sp.style.transition = "opacity .5s"; sp.style.opacity = "0";
          setTimeout(function () { sp.remove(); }, 600);
        }, 8000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
