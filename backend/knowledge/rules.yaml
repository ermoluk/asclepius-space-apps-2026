# Hand-encoded rule subset from knowledge-base/05-rules.md (IDs, CFs, levels, actions, refs as written there).
# Schema: {id, system, label, when, then:{hypothesis|escalation, cf, level}, expected?, modifiers?:{P-xx: bonus},
#          actions:[A-..], confirm_with:[fact], refs:[key]}
# when  = {all:[...]} | {any:[...]} | {not: ...} | {fact, op, value}; ops: eq ne gt gte lt lte between in true.
# Missing facts are unknown (tri-state). Closed-world facts (absent = false): sym_*, mod_*, hyp_*, confusion and
# habitat alarms (see engine.CLOSED_WORLD_*). Escalations ("esc" in 05-rules) carry cf 1.0 (used only to rank
# pending checks). Modifier rules R-EYE-03, R-VES-02, R-CV-14 are `modifiers:` on R-EYE-01, R-VES-01, R-CV-13.
# R-GU-04P (controller addition) encodes "RED with P-02" from R-GU-04; R-GU-04 excludes P-02 so the same
# evidence is not counted twice (CF stays 0.7 as in 05-rules).
# All CFs are team heuristics [T].

# ---------------------------------------------------------------- SLEEP
- id: R-SLP-01
  system: SLEEP
  label: Sleep ≤ 6 h for 3+ nights in a row
  when: {fact: days_sleep_le6, op: gte, value: 3}
  then: {hypothesis: X01, cf: 0.8, level: YELLOW}
  actions: [A-SLP-01, A-SLP-02, A-SLP-03, A-SLP-05]
  confirm_with: []
  refs: [RISK-SLEEP, TB041, BARGER2014, JONES2022]

- id: R-SLP-02
  system: SLEEP
  label: Poor sleeper (P-10) and sleep < 6 h for 2 nights
  when:
    all:
      - {fact: mod_P-10, op: "true"}
      - {fact: days_sleep_lt6, op: gte, value: 2}
  then: {hypothesis: X01, cf: 0.7, level: YELLOW}
  actions: [A-SLP-01, A-SLP-02]
  confirm_with: []
  refs: [PSQI, ISI]

- id: R-SLP-04
  system: SLEEP
  label: Sleepiness KSS ≥ 7
  when: {fact: kss, op: gte, value: 7}
  then: {hypothesis: X02, cf: 0.6, level: ORANGE}
  actions: [A-GEN-08, A-SLP-04]
  confirm_with: [pvt_rt]
  refs: [KSS]

- id: R-SLP-05
  system: SLEEP
  label: Sleep deficit and reaction time > 15% slower than baseline
  when:
    all:
      - {fact: hyp_X01, op: "true"}
      - {fact: delta_pct_pvt_rt, op: gt, value: 0.15}
  then: {hypothesis: X02, cf: 0.75, level: ORANGE}
  actions: [A-GEN-08, A-SLP-04, A-GEN-02]
  confirm_with: []
  refs: [PVT-BASNER, RST-ISS]

- id: R-SLP-07
  system: SLEEP
  label: ≥ 16 h awake, > 16 h work or > 6 work days in a row
  when:
    any:
      - {fact: awake_hours, op: gte, value: 16}
      - {fact: work_hours, op: gt, value: 16}
      - {fact: work_days_in_row, op: gt, value: 6}
  then: {hypothesis: X02, cf: 0.5, level: YELLOW}
  actions: [A-SLP-06]
  confirm_with: []
  refs: [RISK-SLEEP]

- id: R-SLP-08
  system: SLEEP
  label: Workload ≥ 8 on 3 of 7 days and sleep < 6 h
  when:
    all:
      - {fact: count7_workload_ge8, op: gte, value: 3}
      - {fact: sleep_hours, op: lt, value: 6}
  then: {hypothesis: X02, cf: 0.5, level: YELLOW}
  actions: [A-SLP-06, A-BEH-05]
  confirm_with: []
  refs: [TB-COGWL, BEDFORD]

- id: R-SLP-09
  system: SLEEP
  label: Poor sleep in the first days of flight (expected)
  expected: true
  when:
    all:
      - {fact: adaptation_window, op: "true"}
      - any:
          - {fact: sleep_quality, op: lte, value: 2}
          - {fact: sleep_hours, op: lt, value: 6}
  then: {hypothesis: C062, cf: 0.7, level: GREEN}
  actions: [A-SLP-05, A-SLP-02]
  confirm_with: []
  refs: [IMM-INC, BARGER2014]

- id: R-SLP-10
  system: SLEEP
  label: Short or poor sleep on ≥ 7 of 14 days after adaptation
  when:
    all:
      - {not: {fact: adaptation_window, op: "true"}}
      - {fact: count14_poor_sleep, op: gte, value: 7}
  then: {hypothesis: C064, cf: 0.7, level: YELLOW}
  actions: [A-SLP-01, A-SLP-02, A-SLP-03, A-SLP-05, A-SLP-07]
  confirm_with: []
  refs: [RISK-SLEEP, ISI]

