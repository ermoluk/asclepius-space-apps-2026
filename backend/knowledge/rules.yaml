- id: R-IMM-04
  system: IMMUNE
  label: Suspected infection with qSOFA ≥ 2
  when:
    all:
      - any:
          - {fact: temp, op: gte, value: 38.1}
          - {fact: sym_fever_chills, op: "true"}
          - {fact: hyp_C077, op: "true"}
          - {fact: hyp_C096, op: "true"}
          - {fact: hyp_C084, op: "true"}
          - {fact: hyp_C049, op: "true"}
          - {fact: hyp_C056, op: "true"}
      # qSOFA >= 2 as "2 of 3" raw leaves (RR >= 22, altered mentation, SBP <= 100) so an unmeasured
      # vital stays unknown; the derived `qsofa` fact scores missing vitals as 0 and is for display only.
      - any:
          - all:
              - {fact: resp_rate, op: gte, value: 22}
              - {fact: confusion, op: "true"}
          - all:
              - {fact: resp_rate, op: gte, value: 22}
              - {fact: bp_sys, op: lte, value: 100}
          - all:
              - {fact: confusion, op: "true"}
              - {fact: bp_sys, op: lte, value: 100}
  then: {hypothesis: C080, cf: 0.85, level: RED}
  actions: [A-GEN-10, A-GEN-03]
  confirm_with: []
  refs: [SEPSIS3]

- id: R-IMM-06
