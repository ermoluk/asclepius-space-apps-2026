          - {fact: sym_itching, op: "true"}
          - {fact: sym_rash, op: "true"}
          - {fact: sym_lip_tongue_swelling, op: "true"}
      - any:
          - {fact: sym_throat_tightness, op: "true"}
          - {fact: sym_shortness_of_breath, op: "true"}
          - {fact: bp_sys, op: lt, value: 90}
  then: {hypothesis: C016, cf: 0.9, level: RED}
  modifiers: {P-08: 0.05}
