  label: Hives or itching without airway, breathing or BP signs
  when:
    all:
      - any:
          - {fact: sym_hives, op: "true"}
          - {fact: sym_itching, op: "true"}
      - not:
          any:
            - {fact: sym_throat_tightness, op: "true"}
            - {fact: sym_shortness_of_breath, op: "true"}
            - {fact: bp_sys, op: lt, value: 90}
  then: {hypothesis: C013, cf: 0.7, level: YELLOW}
  actions: [A-IMM-01, A-GEN-05]
  confirm_with: []
  refs: [ANAPH]

- id: R-IMM-02
