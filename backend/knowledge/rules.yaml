            - {fact: sym_urinary_retention, op: "true"}
            - {fact: sym_urinary_incontinence, op: "true"}
            - {fact: sym_fever_chills, op: "true"}
            - {fact: temp, op: gte, value: 38.1}
  then: {hypothesis: C022, cf: 0.7, level: GREEN}
  actions: [A-MSK-04]
  confirm_with: []
  refs: [KERSTMAN2012, IMM-INC]

- id: R-MSK-02
