# ---------------------------------------------------------------- RULES FED BY THE SIX-MONTH PASSPORT DATA
# Personal baselines, personal ranges (p10..p90) and lab reference ranges come from data/passports/<crew>.json
# (pipeline: Inspiration4 labs, NHANES exams, LifeSnaps daily streams). R-CV-17 is the knowledge-base indicator
# threshold for HRV (03-indicators I-VIT-hrv_rmssd, team threshold [T]).
- id: R-CV-15
  system: CV
  label: Resting HR > 115% of personal baseline for 3+ days, no fever (recovery flag)
  when:
    all:
      - {fact: days_hr_gt15, op: gte, value: 3}
      - not:
          any:
            - {fact: sym_fever_chills, op: "true"}
            - {fact: temp, op: gte, value: 38.1}
  then: {hypothesis: X02, cf: 0.3, level: YELLOW}
  actions: [A-SLP-06, A-GEN-05]
  confirm_with: [temp]
  refs: [CV-ER]  # threshold is a team heuristic [T]

- id: R-CV-16
  system: CV
  label: Hemoglobin below the lab reference range with fatigue (space anemia)
  when:
    all:
      - {fact: lab_below_hemoglobin, op: "true"}
      - any:
          - {fact: sym_fatigue, op: "true"}
          - {fact: fatigue, op: gte, value: 5}
  then: {hypothesis: X15, cf: 0.6, level: ORANGE}
  actions: [A-GEN-02, A-GEN-06]
  confirm_with: []
  refs: [TRUDEL2022]

- id: R-CV-17
  system: CV
  label: HRV (RMSSD) more than 30% below personal baseline for 3+ mornings (recovery flag)
  when: {fact: days_hrv_lt70, op: gte, value: 3}
  then: {hypothesis: X02, cf: 0.3, level: YELLOW}
  actions: [A-SLP-06, A-GEN-05]
  confirm_with: [hr_rest]
  refs: [CV-ER]  # threshold from 03-indicators I-VIT-hrv_rmssd, team heuristic [T]

